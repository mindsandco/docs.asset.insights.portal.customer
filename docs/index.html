<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Insights Portal</title>
  <meta name="description" content="Asset Insights Portal by Antire. One trusted view of every asset you own and operate. Bridging your goals with trusted AI." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="app">Loading Asset Insights Portal…</div>
  <script>
    window.$docsify = {
      name: 'Asset Insights Portal',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      homepage: 'README.md',
      search: {
        placeholder: 'Search the portal',
        noData: 'No results.',
        depth: 3
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      plugins: [
        function (hook) {
          var TIERS = [
            { max: 5, name: 'Starter', price: 1350 },
            { max: 20, name: 'Growth', price: 2000 },
            { max: 50, name: 'Scale', price: 3350 },
            { max: 100, name: 'Enterprise', price: 6700 }
          ];
          var BASE = 13400;
          function eur(n) { return '€' + n.toLocaleString('en-US'); }
          hook.doneEach(function () {
            var input = document.getElementById('pc-fields');
            var out = document.getElementById('pc-result');
            if (!input || !out) return;
            function render() {
              var n = parseInt(input.value, 10);
              if (!n || n < 1) {
                out.innerHTML = '<p class="pc-hint">Enter how many fields you want to register.</p>';
                return;
              }
              if (n > 100) {
                out.innerHTML =
                  '<div class="pc-tier">Custom</div>' +
                  '<p class="pc-hint">More than 100 fields. <a href="mailto:hello@antire.com?subject=Asset%20Insights%20Portal%20-%20Custom%20pricing">Let\'s talk</a> and we\'ll size the right plan.</p>';
                return;
              }
              var t = TIERS.filter(function (x) { return n <= x.max; })[0];
              out.innerHTML =
                '<div class="pc-tier">' + t.name + '</div>' +
                '<div class="pc-price">' + eur(t.price) + '<span>&nbsp;/ month</span></div>' +
                '<p class="pc-hint">Up to ' + t.max + ' fields · one-time base fee ' + eur(BASE) + '</p>';
            }
            input.addEventListener('input', render);
            render();
          });
        },
        function (hook) {
          // Azure infrastructure cost calculator.
          // Deployment sizes come from our reference architecture. Azure list prices are
          // West Europe, EUR, pay-as-you-go, retrieved from the Azure retail price API
          // on 2026-08-03. When refreshing prices, update the date in pricing.md too.
          var SIZES = [
            { name: 'Sandbox', sku: 'Standard_D2as_v5', nodes: 3, maxReq: 7500, compute: 200, disks: 79 },
            { name: 'Pilot', sku: 'Standard_D4as_v5', nodes: 3, maxReq: 17000, compute: 400, disks: 136 },
            { name: 'Production', sku: 'Standard_D8as_v5', nodes: 3, maxReq: 35600, compute: 800, disks: 267 },
            { name: 'Scale', sku: 'Standard_D32as_v5', nodes: 3, maxReq: 147000, compute: 3198, disks: 830 },
            { name: 'Large', sku: 'Standard_D64as_v5', nodes: 3, maxReq: 296000, compute: 6396, disks: 1544 }
          ];
          var AKS = 64;        // AKS Standard tier uptime SLA, EUR 0.0878 per hour
          var PLATFORM = 38;   // load balancer rules, static IP, container registry, key vault
          var EGRESS_BANDS = [[10000, 0.0702], [40000, 0.0570], [100000, 0.0527], [Infinity, 0.0351]];
          var LB_PER_GB = 0.0044;
          var MSG_BYTES = 500;
          function eur0(n) { return '€' + Math.round(n).toLocaleString('en-US'); }
          function egressCost(gb) {
            var left = Math.max(0, gb - 100), cost = 0;
            for (var i = 0; i < EGRESS_BANDS.length && left > 0; i++) {
              var take = Math.min(left, EGRESS_BANDS[i][0]);
              cost += take * EGRESS_BANDS[i][1];
              left -= take;
            }
            return cost;
          }
          hook.doneEach(function () {
            var gwInput = document.getElementById('ic-gateways');
            var rateInput = document.getElementById('ic-readings');
            var out = document.getElementById('ic-result');
            if (!gwInput || !rateInput || !out) return;
            function render() {
              var gw = parseInt(gwInput.value, 10);
              if (!gw || gw < 1) {
                out.innerHTML = '<p class="pc-hint">Enter how many gateways you plan to connect.</p>';
                return;
              }
              var perMin = parseFloat(rateInput.value);
              var req = gw * perMin;
              var size = SIZES.filter(function (s) { return req <= s.maxReq; })[0];
              if (!size) {
                out.innerHTML =
                  '<div class="pc-tier">Custom</div>' +
                  '<p class="pc-hint">This is beyond our largest reference deployment. ' +
                  '<a href="mailto:hello@antire.com?subject=Asset%20Insights%20Portal%20-%20Infrastructure%20sizing">Talk with us</a> ' +
                  'and we will size it with you.</p>';
                return;
              }
              // Harmonized messages leaving the platform, plus a margin for portal and API traffic.
              var gb = req * 60 * 730 * MSG_BYTES * 1.1 / 1e9;
              var egress = egressCost(gb) + gb * LB_PER_GB;
              var total = size.compute + AKS + size.disks + egress + PLATFORM;
              out.innerHTML =
                '<div class="pc-tier">' + size.name + ' deployment</div>' +
                '<div class="pc-price">' + eur0(total) + '<span>&nbsp;/ month on Azure</span></div>' +
                '<p class="pc-hint">' + size.nodes + ' × ' + size.sku + ' · ' +
                Math.round(req).toLocaleString('en-US') + ' ingest requests per minute · ' +
                Math.round(gb).toLocaleString('en-US') + ' GB out per month</p>' +
                '<table class="ic-table"><tbody>' +
                '<tr><td>Cluster nodes</td><td>' + eur0(size.compute) + '</td></tr>' +
                '<tr><td>Managed Kubernetes</td><td>' + eur0(AKS) + '</td></tr>' +
                '<tr><td>Storage for the broker, databases and logs</td><td>' + eur0(size.disks) + '</td></tr>' +
                '<tr><td>Outbound data</td><td>' + eur0(egress) + '</td></tr>' +
                '<tr><td>Networking, registry and key vault</td><td>' + eur0(PLATFORM) + '</td></tr>' +
                '</tbody></table>' +
                '<p class="pc-hint">A one year reserved instance takes roughly 37 percent off the node line, ' +
                'and three years takes roughly 55 percent, so this deployment lands near ' +
                eur0(total - size.compute * 0.55) + ' per month on a three year commitment.</p>';
            }
            gwInput.addEventListener('input', render);
            rateInput.addEventListener('change', render);
            render();
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
